<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Tienda de Avatares - Racoon Teacher</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/avatars.css">
    <link rel="stylesheet" href="css/transitions.css">
</head>
<body>
    <header class="store-header">
        <button onclick="navigateTo('index.html')" class="back-btn">← Volver</button>
        <h1>🎭 Tienda de Avatares</h1>
        <div class="vb-display">
            💎 <span id="vbDisplay">0</span>
        </div>
    </header>

    <main class="store-main">
        <section class="current-avatar-section">
            <h2>Tu Avatar Equipado</h2>
            <div class="current-avatar-card">
                <div id="currentAvatarEmoji" class="large-avatar-emoji">🦝</div>
                <div id="currentAvatarName" class="current-avatar-name">Mapache Default</div>
            </div>
        </section>

        <section class="store-catalog">
            <h2>Catálogo de Avatares</h2>
            <div id="avatarGrid" class="avatar-grid">
                <!-- Avatar cards dynamically rendered here -->
            </div>
        </section>
    </main>

    <!-- Modal de Confirmación de Compra -->
    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Confirmar Compra</h3>
            <div id="modalAvatarEmoji" class="modal-avatar-emoji">🦝</div>
            <p id="modalAvatarName" class="modal-avatar-name">Nombre Avatar</p>
            <p class="modal-price">Precio: 💎 <span id="modalAvatarPrice">0</span></p>
            <div class="modal-actions">
                <button id="btnCancelBuy" class="btn-secondary">Cancelar</button>
                <button id="btnConfirmBuy" class="btn-primary">Comprar 💎</button>
            </div>
        </div>
    </div>

    <script src="js/transitions.js"></script>
    <script type="module" src="js/avatars.js"></script>
</body>
</html>
