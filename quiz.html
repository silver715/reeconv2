<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 🦝 — Racoon Teacher</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3.3">
    <link rel="stylesheet" href="css/quiz.css?v=3.3">
    <link rel="stylesheet" href="css/transitions.css?v=3.3">
</head>
<body>
    <header class="quiz-header">
        <button class="back-btn" onclick="navigateTo('index.html')">← Volver</button>
        <div id="modeLabel" class="subject-badge">Materia</div>
        <div id="questionCounter" class="counter">Pregunta 1/5</div>
    </header>

    <main class="quiz-container">
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="quizScreen" class="quiz-card fadeUp">
            <h2 id="questionText">Cargando pregunta...</h2>
            <div class="options-grid">
                <button class="option-btn" onclick="window.selectOption(0)">A. <span id="opt0"></span></button>
                <button class="option-btn" onclick="window.selectOption(1)">B. <span id="opt1"></span></button>
                <button class="option-btn" onclick="window.selectOption(2)">C. <span id="opt2"></span></button>
                <button class="option-btn" onclick="window.selectOption(3)">D. <span id="opt3"></span></button>
            </div>
        </div>

        <div id="resultsScreen" class="results-card hidden fadeUp">
            <div class="results-avatar-wrapper">
                <img id="resultsAvatar" src="img/avatars/raccoon_happy.png" alt="Mapache" class="results-raccoon-img">
                <div id="resultsBadge" class="results-trophy-badge">🏆</div>
            </div>

            <h2 id="resultsTitle" class="results-title">¡Quiz Completado! 🎉</h2>
            <p id="resultsSubtitle" class="results-subtitle">¡Excelente esfuerzo!</p>

            <div id="starsContainer" class="stars">⭐⭐⭐</div>

            <div class="results-stats-grid">
                <div class="stat-box">
                    <span class="stat-icon">🎯</span>
                    <div class="stat-info">
                        <span class="stat-label">Aciertos</span>
                        <span id="scoreText" class="stat-value">5 / 5</span>
                    </div>
                </div>

                <div class="stat-box stat-xp">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-info">
                        <span class="stat-label">XP Ganada</span>
                        <span id="xpEarnedText" class="stat-value xp-value">+700 XP</span>
                    </div>
                </div>

                <div class="stat-box stat-accuracy">
                    <span class="stat-icon">📊</span>
                    <div class="stat-info">
                        <span class="stat-label">Precisión</span>
                        <span id="accuracyText" class="stat-value">100%</span>
                    </div>
                </div>
            </div>

            <div class="results-actions">
                <button class="btn btn-primary" onclick="window.restartQuiz()">🔄 Reintentar Quiz</button>
                <button class="btn btn-secondary" onclick="navigateTo('index.html')">🏠 Ir al Menú</button>
            </div>
        </div>
    </main>

    <script src="js/transitions.js"></script>
    <script type="module" src="js/quiz.js?v=3.3"></script>
</body>
</html>
