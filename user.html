<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racoon Teacher 🦝 — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/transitions.css">
  <style>
    .pw-hint {
      font-size: 0.76rem;
      color: var(--text-soft);
      margin-top: 5px;
      line-height: 1.3;
      display: none;
    }
    .pw-hint.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div class="bg-shapes">
    <div class="shape shape-1">🦝</div>
    <div class="shape shape-2">📐</div>
    <div class="shape shape-3">🌱</div>
    <div class="shape shape-4">📖</div>
    <div class="shape shape-5">🌐</div>
    <div class="shape shape-6">🗺️</div>
  </div>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="card-header">
        <div class="raccoon-avatar">🦝</div>
        <h1 class="brand-title">Racoon Teacher</h1>
        <p class="brand-sub" id="cardSubTitle">¡Bienvenido de vuelta!</p>
      </div>

      <div id="error-msg" class="error-banner" style="display:none;"></div>

      <div class="form-body">

        <!-- Campo de Nombre completo (para Registro) -->
        <div class="input-group" id="nameGroup" style="display:none;">
          <label for="regName">Nombre del Estudiante</label>
          <div class="input-wrapper">
            <span class="input-icon">🙂</span>
            <input type="text" id="regName" placeholder="Ej: Santiago Pérez" autocomplete="name">
          </div>
        </div>

        <!-- Campo de Correo Electrónico -->
        <div class="input-group">
          <label for="emailInput">Correo Electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="text" id="emailInput" placeholder="correo@ejemplo.com" autocomplete="email">
          </div>
        </div>

        <!-- Campo de Contraseña -->
        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
            <button class="toggle-pw" type="button" id="togglePw" title="Mostrar u ocultar contraseña">👁️</button>
          </div>
          <div class="pw-hint" id="pwHint">
            ℹ️ Mínimo 6 caracteres con al menos 1 mayúscula, 1 minúscula y 1 número (ej: <code>Racoon2026</code>).
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            Recordar correo
          </label>
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleSubmit()">
          <span class="btn-text">Entrar al aula</span>
          <span class="btn-arrow">→</span>
        </button>

      </div>

      <div class="card-footer">
        <p id="toggleModeText">¿No tienes cuenta? <a href="#" onclick="toggleMode()">Regístrate gratis</a></p>
      </div>

    </div>

  </div>

  <script src="js/transitions.js"></script>
  <script type="module" src="js/auth.js?v=3.1"></script>
</body>
</html>
