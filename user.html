<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racoon Teacher 🦝 — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/transitions.css">
</head>
<body>

  <div class="bg-shapes">
    <div class="shape shape-1">🦝</div>
    <div class="shape shape-2">📐</div>
    <div class="shape shape-3">🌱</div>
    <div class="shape shape-4">📖</div>
    <div class="shape shape-5">🌐</div>
    <div class="shape shape-6">🗺️</div>
  </div>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="card-header">
        <div class="raccoon-avatar">🦝</div>
        <h1 class="brand-title">Racoon Teacher</h1>
        <p class="brand-sub">¡Bienvenido de vuelta!</p>
      </div>

      <div id="error-msg" class="error-banner" style="display:none;"></div>

      <div class="form-body">

        <div class="input-group" id="nameGroup" style="display:none;">
          <label for="regName">Nombre</label>
          <div class="input-wrapper">
            <span class="input-icon">🙂</span>
            <input type="text" id="regName" placeholder="Tu nombre" autocomplete="name">
          </div>
        </div>

        <div class="input-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" placeholder="Tu nombre de usuario" autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
            <button class="toggle-pw" type="button" id="togglePw" title="Mostrar contraseña">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            Recordarme
          </label>
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleSubmit()">
          <span class="btn-text">Entrar al aula</span>
          <span class="btn-arrow">→</span>
        </button>

      </div>

      <div class="card-footer">
        <p id="toggleModeText">¿No tienes cuenta? <a href="#" onclick="toggleMode()">Regístrate gratis</a></p>
      </div>

    </div>

  </div>

  <script src="js/transitions.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
